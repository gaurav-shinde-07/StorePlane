# Default values for store-platform
# This is a YAML-formatted file.

# Global settings
global:
  environment: production
  domain: .example.com
  ingressClass: nginx

# Backend API configuration
backend:
  enabled: true
  replicaCount: 2
  
  image:
    repository: store-platform-backend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  
  env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "4000"
    - name: IN_CLUSTER
      value: "true"
    - name: DEFAULT_DOMAIN
      valueFrom:
        configMapKeyRef:
          name: store-platform-config
          key: domain
    - name: INGRESS_CLASS
      value: "nginx"
    - name: MAX_STORES_PER_USER
      value: "10"
    - name: DEFAULT_CPU_REQUEST
      value: "100m"
    - name: DEFAULT_CPU_LIMIT
      value: "500m"
    - name: DEFAULT_MEMORY_REQUEST
      value: "256Mi"
    - name: DEFAULT_MEMORY_LIMIT
      value: "1Gi"
    - name: DEFAULT_STORAGE
      value: "5Gi"

# Frontend Dashboard configuration
dashboard:
  enabled: true
  replicaCount: 2
  
  image:
    repository: store-platform-dashboard
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3000
    targetPort: 80
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  
  dashboard:
    host: dashboard.example.com
    path: /
    pathType: Prefix
  
  backend:
    host: api.example.com
    path: /
    pathType: Prefix

# RBAC configuration
rbac:
  enabled: true
  serviceAccount:
    create: true
    name: store-platform-sa
    annotations: {}

# Security settings
security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

# Resource quotas per namespace
resourceQuotas:
  enabled: true
  cpu: "2"
  memory: "4Gi"
  storage: "10Gi"
  persistentVolumeClaims: "5"

# Network policies
networkPolicies:
  enabled: false

# Monitoring
monitoring:
  enabled: false
  
# Storage class
storageClass: standard